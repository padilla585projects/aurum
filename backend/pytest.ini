[pytest]
testpaths = tests
pythonpath = .
addopts = -q
filterwarnings =
    # Starlette avisa de que su TestClient pasará a httpx2. No afecta a nada de
    # lo que se prueba aquí y ensucia la salida en cada ejecución.
    ignore::DeprecationWarning:starlette.testclient
    ignore:Using `httpx` with `starlette.testclient` is deprecated
